services:
  - type: web
    name: rhymic
    env: python
    buildCommand: ./build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"

      - key: NODE_VERSION
        value: "22.16.0"

      - key: FLASK_CONFIG
        value: production

      - key: ONLINE_STREAM_PROVIDER
        value: auto

      - key: RESOLVER_PORT
        value: "3001"

      - key: RESOLVER_HOSTPORT
        value: "127.0.0.1:3001"

      - key: WEB_CONCURRENCY
        value: "1"

      - key: RESOLVER_API_KEY
        generateValue: true

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_KEY
        sync: false

      - key: YT_COOKIES_B64
        sync: false

      - key: YT_OAUTH_CREDENTIALS
        sync: false

      - key: YT_PIPED_INSTANCES
        sync: false
