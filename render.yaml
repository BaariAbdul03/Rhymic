services:
  # ----------------------------------------
  # Flask Backend Service (Serves SPA from /dist)
  # ----------------------------------------
  - type: web
    name: rhymic-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn app:app --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_CONFIG
        value: "production"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: RESOLVER_SERVICE_URL
        sync: false
      - key: RESOLVER_API_KEY
        sync: false

  # ----------------------------------------
  # Node.js Audio Resolver Microservice
  # Runs on a separate Render IP to bypass YouTube's
  # data-center IP blocks on the Flask service.
  # ----------------------------------------
  - type: web
    name: rhymic-resolver
    env: node
    rootDir: resolver-service
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RESOLVER_API_KEY
        sync: false
