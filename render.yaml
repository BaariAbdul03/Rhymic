services:
  # ----------------------------------------
  # Flask Backend Service (Serves SPA from /dist)
  # ----------------------------------------
  - type: web
    name: rhymic-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn app:app --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_CONFIG
        value: "production"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
