name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      - name: Run backend tests
        run: |
          pytest backend/tests/ -v --cov=backend --cov-report=xml
        env:
          FLASK_CONFIG: test
          DATABASE_URL: sqlite:///:memory:
          
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rhymic-react/package-lock.json
          
      - name: Install frontend deps
        working-directory: rhymic-react
        run: npm ci
          
      - name: Lint
        working-directory: rhymic-react
        run: npm run lint
        
      - name: Build
        working-directory: rhymic-react
        run: npm run build

  build-prod:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install production deps
        run: pip install -r requirements.txt gunicorn
        
      - name: Verify production startup against a disposable database
        run: |
          python scripts/run_migrations.py
          python -c "from backend import create_app; app = create_app('production'); assert app.test_client().get('/api/health').status_code == 200"
        env:
          FLASK_CONFIG: production
          DATABASE_URL: sqlite:////tmp/rhymic-ci.db
          JWT_SECRET_KEY: rhymic-ci-disposable-key
