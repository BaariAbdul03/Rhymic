services:
  # ----------------------------------------
  # Rhymic Unified Service (Flask + Node Resolver)
  # ----------------------------------------
  - type: web
    name: rhymic-backend
    env: python
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_CONFIG
        value: "production"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: RESOLVER_API_KEY
        sync: false
